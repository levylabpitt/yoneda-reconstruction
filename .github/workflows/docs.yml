name: docs

# Builds docs/Yoneda-Reconstruction.pdf from its LaTeX source and commits it.
# Triggered only by changes to the sources, so the PDF commit cannot retrigger it.
on:
  push:
    branches: [main]
    paths:
      - "docs/**.tex"
      - "docs/**.bib"
      - "docs/fig/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The organization allows only GitHub-owned actions, so TeX comes from apt.
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends latexmk texlive-latex-recommended \
            texlive-latex-extra texlive-pictures texlive-fonts-recommended
      - name: Build
        working-directory: docs
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error Yoneda-Reconstruction.tex
      - name: Commit the PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Yoneda-Reconstruction.pdf
          if git diff --cached --quiet; then echo "PDF unchanged"; exit 0; fi
          git commit -m "docs: rebuild Yoneda-Reconstruction.pdf [skip ci]"
          git push
